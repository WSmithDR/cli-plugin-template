name: Validate catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate catalog integrity
        run: python3 bin/validate-catalog.py
      # El bump lo hace el hook post-commit local; acá solo se detecta drift
      # (ej. un commit hecho desde la web de GitHub, sin hooks).
      - name: Validate manifest version sync
        run: python3 bin/bump-version.py --check
      - name: Validate skill evals schema
        run: python3 bin/validate-evals.py
      - name: Validate shell scripts parse
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "✗ $f"; fail=1; }
          done < <(find features bin \( -name '*.sh' -o -name 'pre-commit' -o -name 'post-commit' \))
          exit $fail
      - name: Validate JSON files parse
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "✗ $f"; fail=1; }
          done < <(find features .claude-plugin .codex-plugin .cursor-plugin .copilot-plugin \
                     -name '*.json' 2>/dev/null; \
                   ls gemini-extension.json opencode.json 2>/dev/null)
          exit $fail
      # Loop sobre TODAS las suites: una suite nueva en bin/ entra al CI sola,
      # sin recordar editar este workflow (raíz del TODO "suites fuera del CI").
      - name: Run test suites
        run: |
          fail=0
          for t in bin/test-*.sh; do
            echo "== $t"
            bash "$t" || fail=1
          done
          exit $fail
      - name: Portability audit (block on CRITICAL)
        run: python3 features/portability-audit/files/audit-portability.py . --quiet
